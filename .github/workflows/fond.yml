name: Fond d'écran Trakt

on:
  schedule:
    - cron: "7 * * * *"      # toutes les heures, à la 7e minute
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fond-trakt
  cancel-in-progress: true

jobs:
  generer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    env:
      TZ: Europe/Paris
      THEME: papier             # « papier », « appareil » ou « affiche »
      TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      TRAKT_USERNAME: ${{ secrets.TRAKT_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Pillow
        run: pip install Pillow

      - name: Générer les images
        run: python trakt_wallpaper.py --ci

      - name: Garder l'historique des mois passés et les polices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache polices
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour du cache"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publier les images
        id: deploiement
        uses: actions/deploy-pages@v4
